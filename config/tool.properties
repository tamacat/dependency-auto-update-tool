# dependency-auto-update-tool configuration (repo-checked-in).
#
# This file holds three independent concerns (Application Design ADR-4,
# extended by ADR-8): the global commit/push mode, which branches this tool
# is allowed to operate on and their expected JDK major version (BR-3), and
# a per-dependency version-range policy map. It does NOT hold the
# machine-local JDK-home mapping -- that lives in the separate, gitignored
# config/jdk-home.local.properties (see jdk-home.local.properties.template).

# Commit/push mode:
#   LOCAL_COMMIT_MANUAL_APPROVAL (default) -- stop after a local commit; the
#     maintainer decides push/PR.
#   FULL_LOOP_AUTO_PUSH (opt-in) -- also push automatically once validation
#     is green. Materially increases supply-chain exposure by removing the
#     manual-review step before a change reaches origin (see
#     security-requirements.md) -- opt in deliberately, not by default.
commitPushMode=LOCAL_COMMIT_MANUAL_APPROVAL

# Maven repository to query for available versions (Application Design ADR-3
# -- independent of versions-maven-plugin). Defaults to Maven Central.
#repositoryBaseUrl=https://repo1.maven.org/maven2/

# Per-target repository query timeout, in seconds (performance-requirements.md: 30-60s).
#repositoryQueryTimeoutSeconds=45

# Where the structured report file is written (reliability-requirements.md Q5: B).
#reportDir=reports

# Which branches this tool is allowed to operate on, and each one's expected
# JDK major version (business-rules.md BR-3). This tool ships no hardcoded
# branch list of its own -- a branch with no entry here is not a recognized
# target and pre-flight refuses to run against it (BRANCH_JDK_MISMATCH).
# Format: branch.<branchName>.expectedJdkMajor=<integer>. A branch name may
# itself contain dots (e.g. "v2.0-tc11") -- that is fine, the key is parsed
# by trimming the fixed "branch." / ".expectedJdkMajor" prefix/suffix, not
# by splitting on '.'.
#
# This is a repo-wide POLICY fact (true for every clone) -- it is separate
# from the machine-local FACT of where that JDK is actually installed on
# any one machine (config/jdk-home.local.properties).
#
# Shipped pre-configured for this tool's own reference deployment, tamacat-httpd:
branch.v1.6.expectedJdkMajor=8
branch.v2.0-tc11.expectedJdkMajor=25

# Per-dependency version-range policy, keyed by groupId:artifactId. One of
# PATCH_ONLY (default when absent), MINOR, or MAJOR (Application Design Q7: C,
# ADR-8). For a property-indirected group of dependencies (e.g. tamacat-httpd's
# own tomcat.version, shared by tomcat-embed-core and tomcat-embed-jasper),
# the EFFECTIVE policy for the whole group is the most restrictive policy
# configured across its members (business-rules.md BR-1a).
#
# IMPORTANT: the ':' between groupId and artifactId MUST be escaped as '\:'
# in this file -- java.util.Properties (the format this file is parsed with)
# treats an unescaped ':' as a key/value separator, same as '=', so an
# unescaped "policy.groupId:artifactId=POLICY" line silently parses as
# key="policy.groupId", value="artifactId=POLICY" and is never applied as a
# dependency policy at all (verified directly against java.util.Properties;
# see ToolConfigurationTest for the regression test).
#
# Examples (uncomment and adjust as needed):
#policy.org.apache.httpcomponents.core5\:httpcore5=PATCH_ONLY
#policy.org.thymeleaf\:thymeleaf=MINOR
#policy.org.apache.tomcat.embed\:tomcat-embed-core=PATCH_ONLY
#policy.org.apache.tomcat.embed\:tomcat-embed-jasper=PATCH_ONLY

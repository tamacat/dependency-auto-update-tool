[package]
name = "software-update-checker-core"
version.workspace = true
description = "Software Update Checker の取り込みとチェックの処理（GUI と CLI で共通。Tauri に依存しない）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "software_update_checker_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS の TLS ライブラリに依存しないよう rustls を使う
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
# poetry.lock・uv.lock・pyproject.toml の読み込み。tauri の依存に既に含まれている
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
# jar 内のクラスファイル（deflate）の展開。tauri の依存に既に含まれている
miniz_oxide = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# GUI（このパッケージ）、共通の処理（core）、CI 向けのコマンドライン版（cli）の 3 つ。
# Cargo.lock と target/ はこのディレクトリに置く（tauri のビルドとリリースの手順がここを見るため）。
[workspace]
members = ["core", "cli"]

# 版番号はここだけで管理する（package.json・tauri.conf.json と同じ値にそろえる）
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/tamacat/dependency-auto-update-tool"

[package]
name = "software-update-checker"
version.workspace = true
description = "SBOM / pom.xml から依存ソフトウェアを一覧化し、最新版・脆弱性・EOL を確認する GUI ツール"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "software_update_checker_lib"
# デスクトップのみ対象。モバイル対応時は "staticlib", "cdylib" を追加する。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
software-update-checker-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[profile.release]
# 配布サイズを小さくする
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

